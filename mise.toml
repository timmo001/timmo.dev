[tools]
node = "26.13.1"
aube = "v2.10.1"
bun = "1.4.4"
# The hk pre-push hook and the linters it runs, matching timmo001/workflows.
hk = "2.12.0"
pkl = "0.33.0"
"npm:markdownlint-cli2" = "0.24.1"
"pipx:yamllint" = "1.38.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
uv = "0.13.8"

[tasks.install]
run = "aube install --frozen-lockfile"

[tasks.lint]
depends = ["install"]
run = "aube run --no-install lint"

[tasks.typecheck]
depends = ["install"]
run = "aube run --no-install typecheck"

[tasks.format]
depends = ["install"]
run = "aube run --no-install format"

[tasks."format:check"]
depends = ["install"]
run = "aube run --no-install format:check"

[tasks.check]
depends = ["lint", "typecheck", "format:check"]

[tasks.build]
depends = ["install"]
run = "aube run --no-install build"

[tasks."serve:site"]
depends = ["install"]
run = "pitchfork start site"

[tasks."serve:site:status"]
run = "pitchfork status site"

[tasks."serve:site:logs"]
run = "pitchfork logs -t site"

[tasks."serve:site:restart"]
run = "pitchfork restart site"

[tasks."serve:site:stop"]
run = "pitchfork stop site"

[tasks.plan]
description = "Show what deploying the site's prod stage would change"
depends = ["install"]
run = "aube run --no-install plan"

[tasks.deploy]
description = "Build the site and deploy its prod stage with Alchemy"
depends = ["install"]
run = "aube run --no-install deploy"

[tasks."deploy:github"]
description = "Mint CI's Cloudflare token into the repository's secrets"
depends = ["install"]
run = "aube run --no-install deploy:github"
