[tools]
node = "26.12.0"
aube = "v2.7.2"

[tasks.install]
run = "aube install --frozen-lockfile"

[tasks.lint]
depends = ["install"]
run = "aube run --no-install lint"

[tasks.typecheck]
depends = ["install"]
run = "aube run --no-install typecheck"

[tasks.format]
depends = ["install"]
run = "aube run --no-install format"

[tasks."format:check"]
depends = ["install"]
run = "aube run --no-install format:check"

[tasks.check]
depends = ["lint", "typecheck", "format:check"]

[tasks.build]
depends = ["install"]
run = "aube run --no-install build"

[tasks."serve:site"]
depends = ["install"]
run = "pitchfork start site"

[tasks."serve:site:status"]
run = "pitchfork status site"

[tasks."serve:site:logs"]
run = "pitchfork logs -t site"

[tasks."serve:site:restart"]
run = "pitchfork restart site"

[tasks."serve:site:stop"]
run = "pitchfork stop site"

[tasks."deploy:dry-run"]
depends = ["build"]
run = "aube exec wrangler deploy --dry-run"
