[tools]
node = "26.11.1"
"aqua:pnpm/pnpm" = "12.10.1"

[tasks.install]
run = "pnpm install --frozen-lockfile"

[tasks.lint]
depends = ["install"]
run = "pnpm lint"

[tasks.typecheck]
depends = ["install"]
run = "pnpm typecheck"

[tasks.format]
depends = ["install"]
run = "pnpm format"

[tasks."format:check"]
depends = ["install"]
run = "pnpm format:check"

[tasks.check]
depends = ["lint", "typecheck", "format:check"]

[tasks.build]
depends = ["install"]
run = "pnpm build"

[tasks."serve:site"]
depends = ["install"]
run = "pitchfork start site"

[tasks."serve:site:status"]
run = "pitchfork status site"

[tasks."serve:site:logs"]
run = "pitchfork logs -t site"

[tasks."serve:site:restart"]
run = "pitchfork restart site"

[tasks."serve:site:stop"]
run = "pitchfork stop site"

[tasks."deploy:dry-run"]
depends = ["build"]
run = "pnpm wrangler deploy --dry-run"
