[tools]
node = "26.10.0"
"aqua:pnpm/pnpm" = "12.7.0"

[tasks.lint]
run = "pnpm lint"

[tasks.typecheck]
run = "pnpm typecheck"

[tasks.format]
run = "pnpm format"

[tasks.check]
depends = ["lint", "typecheck", "format"]

[tasks.build]
run = "pnpm build"

[tasks."deploy:dry-run"]
run = "pnpm deploy:dry-run"
