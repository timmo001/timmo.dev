---
name: "CodeQL"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analyze-javascript:
    uses: timmo001/workflows/.github/workflows/codeql-javascript.yml@cef23eb35e34cbf700318426c754e8d77a6167e1 # master
