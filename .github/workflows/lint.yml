---
name: Lint

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
      - run: "mise run check ::: deploy:dry-run"
  lint-markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2
  lint-markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2
  lint-yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2
