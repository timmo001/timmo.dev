---
name: Lint

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
    with:
      name: check
      task: "check ::: build"
  lint-markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
  lint-markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
  lint-yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
