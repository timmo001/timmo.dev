---
name: Lint

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
      - run: "mise run check ::: deploy:dry-run"
  lint-markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0
  lint-markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0
  lint-yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0
