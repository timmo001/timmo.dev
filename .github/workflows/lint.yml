---
name: Lint

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
    with:
      name: check
      task: "check ::: build"
  lint-markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
  lint-markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
  lint-yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
