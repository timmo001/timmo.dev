---
name: Lint

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5
      - run: pnpm install --frozen-lockfile
      - run: mise run check
      - run: mise run deploy:dry-run
  lint-markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@da1f8d52a56ce02034b676a8c91275e822934a68 # 20261001.0
  lint-markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@da1f8d52a56ce02034b676a8c91275e822934a68 # 20261001.0
  lint-yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@da1f8d52a56ce02034b676a8c91275e822934a68 # 20261001.0
