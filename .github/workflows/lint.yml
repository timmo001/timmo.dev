---
name: Lint

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5
      - run: "mise run check ::: deploy:dry-run"
  lint-markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0
  lint-markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0
  lint-yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0
