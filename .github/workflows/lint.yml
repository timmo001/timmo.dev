---
name: Lint

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5
      - run: "mise run check ::: deploy:dry-run"
  lint-markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0
  lint-markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0
  lint-yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0
