---
name: Lint

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

concurrency:
  group: lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5
      - run: "mise run check ::: deploy:dry-run"
  lint-markdown-links:
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
  lint-markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
  lint-yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
