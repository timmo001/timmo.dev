---
# Deploys the prod stage of the site's Alchemy stack in alchemy.run.ts from
# master: the timmo-dev Worker at timmo.dev and the timmo-dev-www-redirect
# Worker at www.timmo.dev. The Cloudflare token comes from stacks/github.ts.
name: Deploy

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

# Deploys queue rather than cancel, so a stack update never stops halfway
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: timmo001/workflows/.github/workflows/deploy-alchemy.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
    with:
      install-args: bun node aube
      smoke-check: |
        https://timmo.dev 200
        https://www.timmo.dev 308
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
